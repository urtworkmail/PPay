services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openpay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: openpay
    volumes:
      - openpay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpay"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Deliberately no `ports:` mapping — Postgres is only reachable from the
    # `backend` container over the internal Docker network, never from outside
    # the VM.

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: ./.env
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        # Empty on purpose: Caddy proxies /api/* on the same origin as the
        # frontend, so the app calls a relative /api/v1/... URL and never
        # needs CORS in production at all.
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  openpay_pgdata:
  caddy_data:
  caddy_config:
